<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Boulkhedert — Développeur Full Stack</title>

    <!-- La description : c'est le texte que Google affiche sous le titre dans ses résultats (155 caractères maximum) -->
    <meta
      name="description"
      content="Portfolio d'Adam Boulkhedert, développeur full stack à Paris : applications web React, Node.js et PostgreSQL, de la maquette à la mise en ligne."
    />
    <!-- L'auteur de la page : LinkedIn le cherche quand on partage le lien (sans cette balise, son outil
         de vérification affiche « auteur inconnu ») -->
    <meta name="author" content="Adam Boulkhedert" />
    <!-- La couleur de la barre du navigateur sur mobile : le fond du site -->
    <meta name="theme-color" content="#0a0b0f" />

    <!-- L'adresse officielle de la page : si le site est joignable par plusieurs adresses, c'est celle-ci
         que les moteurs de recherche retiennent -->
    <link rel="canonical" href="https://adam-boulkhedert.onrender.com/" />

    <!-- Open Graph : l'aperçu affiché quand on partage le lien (LinkedIn, WhatsApp, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adam-boulkhedert.onrender.com/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Adam Boulkhedert" />
    <meta property="og:title" content="Adam Boulkhedert — Développeur Full Stack" />
    <meta
      property="og:description"
      content="Du métal au code : je conçois des applications web complètes avec React, Node.js et PostgreSQL, de la maquette à la mise en ligne."
    />
    <!-- L'image de l'aperçu : public/og-image.jpg, fabriquée avec l'outil scripts/og-image.js.
         Son adresse doit être complète (avec https://) : les services de partage ne savent pas lire
         une adresse relative. La largeur et la hauteur leur évitent de devoir la mesurer eux-mêmes. -->
    <meta property="og:image" content="https://adam-boulkhedert.onrender.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Le monogramme AB en cours de soudure, à côté du nom Adam Boulkhedert, développeur full stack"
    />
    <!-- Pour X (Twitter) et les services qui lisent ses balises : afficher l'image en grand -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
