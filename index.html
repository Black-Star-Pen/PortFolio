<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Boulkhedert — Développeur Full Stack</title>

    <!-- La description : c'est le texte que Google affiche sous le titre dans ses résultats (155 caractères maximum) -->
    <meta
      name="description"
      content="Portfolio d'Adam Boulkhedert, développeur full stack à Paris : applications web React, Node.js et PostgreSQL, de la maquette à la mise en ligne."
    />
    <!-- La couleur de la barre du navigateur sur mobile : le fond du site -->
    <meta name="theme-color" content="#0a0b0f" />

    <!-- Open Graph : l'aperçu affiché quand on partage le lien (LinkedIn, WhatsApp, Discord…).
         Il manque og:url et og:image : ils demandent l'adresse définitive du site, on les ajoutera à la mise en ligne. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Adam Boulkhedert" />
    <meta property="og:title" content="Adam Boulkhedert — Développeur Full Stack" />
    <meta
      property="og:description"
      content="Du métal au code : je conçois des applications web complètes avec React, Node.js et PostgreSQL, de la maquette à la mise en ligne."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Newsreader:ital,wght@1,300;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
